<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EEDF">
<title>Lia</title>
<link rel="preconnect" href="https://places.googleapis.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
/* fonte 11: EB Garamond (logo, notas, títulos) + Jost (texto); arquivos locais para funcionar offline */
@font-face{font-family:'EB Garamond';src:url(fonts/eb-garamond.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:swap}
@font-face{font-family:'EB Garamond';src:url(fonts/eb-garamond-italic.woff2) format('woff2');font-weight:400 800;font-style:italic;font-display:swap}
@font-face{font-family:Caveat;src:url(fonts/caveat.woff2) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:Jost;src:url(fonts/jost.woff2) format('woff2');font-weight:300 700;font-display:swap}
:root{
  color-scheme:light;
  /* combinação H: azul-tinta sobre papel kraft, terracota no coração */
  --ground:#F6EEDF;--surface:#FFFBF3;--ink:#2E2A24;--ink-2:#6F665A;--line:#E7DCC8;--line-2:#CDBEA5;--track:#ECE1CD;
  --accent:#1F3A93;--accent-deep:#172C70;--accent-tint:#E2E7F5;--heart:#C8553D;
  --win:#2F7A4F;--mid:#B07A1E;--low:#7A7266;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;font:16px/1.45 Jost,system-ui,sans-serif;background:var(--ground);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;caret-color:var(--accent)}
::selection{background:var(--accent-tint);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p,ol{margin:0;padding:0}
ol{list-style:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 16px}
.cond{font-family:'EB Garamond',Georgia,serif;font-weight:500}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.top{background:var(--ground);padding-top:env(safe-area-inset-top);flex:none}
.brand{display:flex;align-items:center;gap:8px;height:56px}
.brand h1{font-family:Caveat,cursive;font-size:40px;font-weight:600;line-height:1;color:var(--accent);transform:rotate(-4deg);transform-origin:left center;margin-top:2px}
.brand span{margin-left:auto;color:var(--ink-2);font-size:14px}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1 1 auto;padding:0 8px;white-space:nowrap;height:38px;border-radius:9px;text-align:center;font-size:14px;font-weight:600;color:var(--ink-2);transition:background .2s var(--ease),color .2s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #1d1a1722}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:var(--line-2) transparent;padding-bottom:104px}
/* barra flutuante: pílula com os destinos e o botão de ação num círculo ao lado */
nav{position:fixed;z-index:1000;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:none}
nav .wrap{display:flex;align-items:center;gap:10px;max-width:440px}
nav .dest{flex:1;display:grid;grid-template-columns:repeat(4,1fr);height:64px;padding:6px;border-radius:32px;background:var(--ink);box-shadow:0 10px 28px -8px #1d1a1788;pointer-events:auto}
nav .dest button{display:grid;justify-items:center;align-content:center;gap:1px;border-radius:26px;font-size:11px;font-weight:600;color:#b9b1a7;text-align:center;transition:background .25s var(--ease),color .2s}
nav .dest svg{width:22px;height:22px}
nav .dest button[aria-current=page]{background:#ffffff1f;color:#fff}
nav .plus{flex:none;width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px #1F3A93aa;pointer-events:auto;transition:transform .2s var(--ease),background .2s}
nav .plus:active{transform:scale(.93);background:var(--accent-deep)}
nav .plus svg{width:28px;height:28px;stroke-width:2.6}
svg.i.hand{stroke-width:2.1}
nav .plus svg.hand{stroke-width:2.2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* tabela */
.thead{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:14px 16px 8px;font-size:12px;letter-spacing:.08em;color:var(--ink-2)}
.table{background:var(--surface);border-block:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 16px;border-bottom:1px solid var(--line)}
.table>li:last-child .row,.table>li:last-child.row{border-bottom:0}
button.row:active,.row-main:active{background:var(--ground)}
.row-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:48px}
.pos{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:19px}
.t{flex:1;min-width:0}
.t b{display:block;font-weight:500;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t small{display:block;font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-size:28px;line-height:1;flex:none}
.z-win{--z:var(--win)}.z-mid{--z:var(--mid)}.z-low{--z:var(--low)}
.pos[class*=z-],.legend i,.pin[class*=z-]{background:var(--z)}
.pts[class*=z-]{color:var(--z)}
.zline{height:0;border-top:2px dashed var(--line-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:14px 16px 28px;font-size:13px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.row.new{animation:land 1.6s var(--ease)}
@keyframes land{from{background:var(--accent-tint)}}

/* vazio */
.empty{padding:28px 16px 32px}
.empty h2{font-family:'EB Garamond',Georgia,serif;font-size:28px;line-height:1.15;font-weight:500;text-wrap:balance}
.empty p{margin:8px 0 20px;color:var(--ink-2);max-width:38ch}
.ghost{margin:0 0 24px}
.ghost li{display:flex;align-items:center;gap:12px;height:56px;border-bottom:2px dashed var(--line-2);color:var(--ink-2);font-size:15px}
.ghost .pos{background:none;border:2px dashed var(--line-2);color:var(--ink-2)}
h2.group{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:22px 16px 8px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:12px;font-weight:700;font-size:16px;transition:transform .15s var(--ease),background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-deep)}
.btn.secondary{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.secondary[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.btn.quiet{color:var(--ink-2);padding:0 8px;font-weight:600}
.btn.danger{color:var(--heart)}
.btn.wide{width:100%}
.btn[hidden]{display:none}
.pill{flex:none;min-height:40px;padding:0 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.iconbtn{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2)}
.iconbtn[aria-pressed=true]{color:var(--accent)}

/* buscar */
.band{background:var(--ground);padding:0 0 12px;position:sticky;top:0;z-index:2}
.field{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:12px;background:var(--surface);color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font:inherit;font-size:17px;color:var(--ink)}
.field input::placeholder{color:var(--ink-2)}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);font-size:15px;font-weight:550}
.chip:active{background:var(--line)}
.msg{padding:28px 16px;color:var(--ink-2)}
.msg .btn{margin-top:14px}
.more{padding:20px 16px 32px}

/* mapa */
main.v-mapa{overflow:hidden;position:relative;padding-bottom:0}
#map{height:100%;background:var(--ground);font:inherit}
.pin{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;border:2px solid #fff;color:#fff;font-size:16px;box-shadow:0 3px 8px -2px #0007}
.pin.want{background:#fff;color:var(--accent);border-radius:50%}
.pin.want svg{width:16px;height:16px}
.maphint{position:absolute;z-index:1050;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;box-shadow:0 4px 12px -4px #0006;pointer-events:none}
.maphint[hidden]{display:none}
.maplibregl-ctrl-bottom-left{bottom:calc(88px + env(safe-area-inset-bottom));left:6px}
.maplibregl-map{font:inherit}
.ring{display:block;width:48px;height:48px;border-radius:50%;border:3px solid var(--accent);pointer-events:none}
.pin{cursor:pointer}
.me{display:block;width:18px;height:18px;border-radius:50%;background:#2456e6;border:3px solid #fff;box-shadow:0 0 0 7px #2456e633}
.mapbtns{position:absolute;z-index:1050;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));display:grid;gap:10px}
.mapbtns button{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 4px 14px -4px #1d1a1766}
.mapbtns button:active{background:var(--track)}
#mapcard{position:absolute;z-index:1100;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--surface);border-radius:20px;padding:8px 8px 14px 16px;box-shadow:0 12px 32px -8px #1d1a1777;animation:rise .3s var(--ease)}
#mapcard::before{content:'';display:block;width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 6px}
/* ficha estilo app de mapas: nome, nota, status, ações em pílulas */
.ph{display:flex;align-items:flex-start;gap:8px}
.ph .t{padding-top:2px}
.ph h2{font-family:'EB Garamond',Georgia,serif;font-size:25px;line-height:1.15;font-weight:500;text-wrap:balance}
.ph .open-sheet{flex:1;min-width:0;text-align:left}
.pline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:4px;font-size:14.5px;color:var(--ink-2)}
.pline .pts{font-size:17px}
.pline .love{margin:0}
.st-open{color:var(--win);font-weight:650}.st-closed{color:var(--heart);font-weight:650}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 8px 0 0}
.cell{display:grid;justify-items:center;align-content:center;gap:4px;min-height:64px;padding:8px 4px;border-radius:14px;background:var(--track);font-size:13.5px;font-weight:650;color:var(--ink);text-decoration:none;text-align:center;transition:transform .15s var(--ease)}
.cell:active{transform:scale(.96)}
.cell svg{width:22px;height:22px}
.cell.primary{background:var(--accent);color:#fff}
.cell[aria-pressed=true]{background:var(--ink);color:#fff}
.cell[data-a=love][aria-pressed=true]{background:var(--heart)}
.sheet .cells{margin:16px 0 0}
.info{margin-top:6px}
.info li{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line);font-size:15px}
.info li:first-child{border-top:0}
.info svg{width:20px;height:20px;color:var(--ink-2);margin-top:1px}
.info a{color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.info details summary{list-style:none;cursor:pointer}
.info li>span,.info li>a,.info details{font-size:15px;line-height:1.4}
.info details summary::-webkit-details-marker{display:none}
.week{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin-top:8px;color:var(--ink-2);font-size:14px}
.week .today{color:var(--ink);font-weight:650}
#mapcard:not([hidden])~.mapbtns{display:none}
.cardhead{display:flex;align-items:center;gap:12px}
.cardacts{display:flex;gap:8px;margin:12px 4px 0 0}
.cardacts .btn{flex:1;min-height:46px;padding:0 10px;font-size:15px;white-space:nowrap}
.cardacts a.btn{text-decoration:none;color:var(--ink)}

/* folha */
dialog{z-index:2000;border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92dvh;border-radius:22px 22px 0 0;background:var(--ground);color:var(--ink);box-shadow:0 -8px 40px -8px #0006}
dialog[open]{animation:rise .35s var(--ease)}
@keyframes rise{from{transform:translateY(28px);opacity:.5}}
dialog::backdrop{background:#1d1a1788}
@media (min-width:640px){dialog{margin:auto;border-radius:22px}}
.sheet{position:relative;padding:22px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet .x{position:absolute;top:10px;right:10px}
.sheet h2{font-family:'EB Garamond',Georgia,serif;font-size:26px;line-height:1.15;font-weight:500;padding-right:40px;text-wrap:balance}
.sub{color:var(--ink-2);font-size:15px;margin-top:2px}
.phead{display:flex;align-items:center;gap:14px;padding-right:36px}
.phead h2{padding:0}
.stat{display:flex;align-items:baseline;gap:12px;margin:18px 0 4px}
.stat .pts{font-size:56px}
.note{margin-top:10px;padding:12px 14px;background:var(--surface);border-radius:12px;color:var(--ink)}
.actions{display:grid;gap:10px;margin-top:20px}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:18px 0 8px}
.side{display:grid;justify-items:center;align-content:center;gap:6px;min-height:176px;padding:16px 10px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-2);text-align:center;transition:transform .15s var(--ease),box-shadow .15s}
.side:active{transform:scale(.97);box-shadow:inset 0 0 0 3px var(--accent)}
.side b{font-size:16px;line-height:1.2;font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
.side small{font-size:13px;color:var(--ink-2)}
.side.in{animation:enter .45s var(--ease)}
@keyframes enter{from{transform:translateX(36px);opacity:.3}}
.vs{font-size:22px;color:var(--ink-2)}
.bar{display:flex;justify-content:space-between;margin:6px -8px 0}
.bar .btn{min-height:44px;font-size:15px}
.bar .btn:disabled{opacity:.4}
.result{display:grid;justify-items:center;text-align:center;gap:4px;padding-top:6px}
.result h2{padding:0;margin-top:6px}
.result .pts{font-size:96px;margin:4px 0}
.lbl{display:block;font-size:14px;font-weight:650;margin:18px 0 6px}
.input,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
.input:focus,textarea:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.sheet .btn.wide{margin-top:16px}
/* amei, comunidade, diário */
.love{color:var(--heart);width:16px;height:16px;vertical-align:-2px;margin-left:4px}
.t b .love{display:inline}
.heart[aria-pressed=true]{color:var(--heart)}
.box{margin-top:18px;padding:14px;background:var(--surface);border-radius:14px}
.box h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.cscore{display:flex;align-items:baseline;gap:10px}
.cscore .pts{font-size:40px}
.hist{display:grid;grid-template-columns:repeat(10,1fr);align-items:end;gap:3px;height:44px;margin-top:12px}
.hist i{display:block;background:var(--line-2);border-radius:3px 3px 0 0;min-height:2px}
.hist i.on{background:var(--accent)}
.hist-x{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-top:4px}
.visits li{border-top:1px solid var(--line);font-size:14.5px}
.visits li>button{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 0;text-align:left}
.visits .vt{flex:1;min-width:0}
.visits li svg{width:16px;height:16px;color:var(--ink-2);flex:none;margin-top:2px}
.visits li:first-child{border-top:0}
.visits time{flex:none;width:72px;color:var(--ink-2)}
.tag{flex:none;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-tint);border-radius:6px;padding:1px 6px;align-self:flex-start}
/* ficha nova (proposta) */
.cover{margin:-20px -20px 14px;height:210px;position:relative;background:var(--track);border-radius:24px 24px 0 0;overflow:hidden}
.cover:empty{background:linear-gradient(90deg,var(--track),var(--surface),var(--track));background-size:200% 100%;animation:skel 1.2s ease-in-out infinite alternate}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover span{position:absolute;right:10px;bottom:8px;font-size:11px;color:#fff;text-shadow:0 1px 3px #000a}
.ph2{position:relative;padding-right:44px}
.ph2 h2{font-family:'EB Garamond',Georgia,serif;font-size:30px;line-height:1.1;font-weight:500;text-wrap:balance}
.pmeta{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.gstat{margin:4px 0 0;font-size:15px;color:var(--ink-2)}.gstat:empty{display:none}
.hshare.top{position:absolute;right:0;top:0}
.hero{display:flex;align-items:center;gap:16px;margin:18px 0 2px;padding:14px 16px;background:var(--surface);border-radius:18px}
.hero .big{font-family:'EB Garamond',Georgia,serif;font-size:64px;line-height:.9;font-weight:500;color:var(--z)}
.sheet .x{z-index:2}.sheet:has(.cover:not([hidden])) .x{background:#fffbf3e6;border-radius:50%}
.hpos{flex:1;display:grid;gap:2px}.hpos b{font-size:19px}.hpos span{color:var(--ink-2);font-size:14px}
.cline{margin:18px 2px 0;font-size:14px;color:var(--ink-2)}.cline b{color:var(--ink)}
.duo{display:flex;gap:8px;margin-top:16px}.duo .btn{flex:1;min-height:46px;font-size:15px}
/* dados do Google */
#mapcard .mg:empty{display:none}
.skel{display:block;height:12px;border-radius:6px;background:var(--track);margin:6px 0;width:180px;animation:skel 1.2s ease-in-out infinite alternate}
.skel.short{width:120px}.skel.sq{flex:none;width:64px;height:64px;border-radius:12px;margin:0}
@keyframes skel{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.gnone{font-size:13px;margin:10px 2px 0}#mapcard .gnone{margin:0}
#mapcard .mg{display:flex;gap:12px;align-items:center;margin:2px 8px 10px 0}
#mapcard .mg img{flex:none;width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--track)}
#mapcard .mg p{margin:0;font-size:14px;line-height:1.35}#mapcard .mg .sub{font-size:13px}
#mapcard .mg .gattr{text-align:left;margin-top:2px;font-size:10px}
.gphoto{margin:14px 0 0;border-radius:16px;overflow:hidden;background:var(--track);aspect-ratio:16/9;position:relative}
.gphoto img{width:100%;height:100%;object-fit:cover;display:block}
.gphoto figcaption{position:absolute;right:8px;bottom:6px;font-size:11px;color:#fff;text-shadow:0 1px 3px #0008}.gphoto figcaption a{color:#fff}
.gattr{margin:8px 0 0;font:500 11px Roboto,Arial,sans-serif;color:#5f6368;text-align:right}
.gicon{display:inline-grid;place-items:center;width:18px;font-weight:700;color:var(--ink-2)}
.gwarn span{color:var(--heart);font-weight:600}
/* amigos */
.dot{position:relative}
.dot::after{content:'';position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--heart);box-shadow:0 0 0 2px var(--ground)}
nav .dest button.dot::after{top:8px;right:calc(50% - 18px);box-shadow:0 0 0 2px var(--ink)}

<script>
// abertura só na primeira vez do dia; roda antes do app para não piscar a tela
(() => {
  const el = document.getElementById('splash'), today = new Date().toDateString();
  let seen = null; try { seen = localStorage.getItem('lia:splash'); localStorage.setItem('lia:splash', today); } catch {}
  if (seen === today) return el.remove();
  el.hidden = false;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const done = () => el.remove();
  const go = () => {
    el.classList.add('go');
    el.addEventListener('animationend', e => { if (e.target === el) done(); });
    setTimeout(done, reduce ? 700 : 1800);   // garantia: some mesmo se a animação não rodar
  };
  // espera a fonte da assinatura (no máximo 400ms) para não escrever com a letra errada
  Promise.race([document.fonts.load('600 108px Caveat'), new Promise(r => setTimeout(r, 400))]).then(go, go);
  el.addEventListener('click', () => el.classList.add('skip'), { once: true });
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script type="module">
import { startSession, current, done, answer, undo, finalValue, scores, community, migrateV1 } from './ranking.mjs';
import { parseHours, hoursStatus, hoursWeek } from './hours.mjs';
import { googleOn, googlePlace, googlePhoto, priceText } from './google.mjs';
import { configured, currentUser, myProfile, signOut, onPasswordRecovery, searchProfiles, uploadPhoto, photoUrls, deletePhotos, errorText, sendReport, loadUserData, saveUserData, deleteAccount, friendView, friendsFeed, friendsAt, setPrivacy, follow, unfollow, acceptFollow, removeFollower, myFollows, sendMentions, myMentions, markMentionsSeen } from './conta.mjs';
import { mergeData } from './sync.mjs';
import { startOnboarding } from './onboarding.mjs';

const CATS = { RES: 'Restaurantes', CAF: 'Cafés e padarias', BAR: 'Bares' };
// --- estado (localStorage) ---
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
// Sincronização: o celular guarda tudo e manda para a conta (user_data) logo depois de cada mudança.
// syncMeta: de quem são os dados deste aparelho, quando foi a última sincronização e se há mudança ainda não enviada.
let syncMeta = load('lia:sync', { userId: null, syncedAt: null, dirty: true });
let syncUser = null, syncState = 'idle', pushTimer = 0;   // syncState: idle | saving | ok | offline
const saveMeta = () => save('lia:sync', syncMeta);
const freshDb = () => ({ v: 2, ranked: [], want: [], custom: [], people: [], favs: [], lists: [], plans: [] });
function fixDb(d) {
  d ||= freshDb();
  if (!d.v) { d.ranked = migrateV1(d.ranked || []); d.v = 2; }   // v2: notas de 1 a 10 (antes: faixas gostei/ok/não gostei)
  d.ranked ||= []; d.want ||= []; d.custom ||= [];
  d.people ||= [];   // {id, name, userId?, username?, used}
  d.favs ||= [];     // até 4 lugares favoritos (ids), mostrados no perfil
  d.lists ||= [];    // {id, name, items: [ids], created}
  d.plans ||= [];    // idas marcadas no Quero ir: {id, placeId, date, with: [], note, created}
  return d;
}
let db = fixDb(load('pinhao:v1', null));   // ranked: {id,name,cat,cuisine,bairro,lat,lon,value,loved,visits:[...],date}
function persist() {
  save('pinhao:v1', db);
  syncMeta.dirty = true; saveMeta();
  if (syncUser) { clearTimeout(pushTimer); pushTimer = setTimeout(pushData, 1500); }   // junta várias mudanças seguidas num envio só
}
save('pinhao:v1', db);
// lugares vêm de places.json (cópia do OpenStreetMap publicada junto com o app; o service worker guarda para uso offline)
let places = null;
try { localStorage.removeItem('pinhao:places'); localStorage.removeItem('pinhao:places2'); } catch {}   // caches antigos, de quando o app baixava do Overpass
let social = { followers: [], following: [], requests: [] }, mentions = [], feed = null, diaryMode = 'me';   // amigos
let rankQueue = [];   // começo guiado: lugares marcados que ainda faltam ranquear
let tab = 'tabela', cat = 'RES', query = '', loadError = '', justRanked = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const norm = s => s.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
// topo de "ok" é exatamente 6.7 e de "não gostei" 3.4, por isso o >
const zone = n => n >= 7 ? 'win' : n >= 4 ? 'mid' : 'low';
const rankedIn = c => db.ranked.filter(r => r.cat === c).sort((a, b) => b.value - a.value);
const allScores = () => Object.assign({}, ...Object.keys(CATS).map(c => scores(rankedIn(c))));
const PT = { japanese: 'japonesa', sushi: 'sushi', pizza: 'pizza', burger: 'hambúrguer', italian: 'italiana', brazilian: 'brasileira', regional: 'regional',
  steak_house: 'churrascaria', barbecue: 'churrasco', chinese: 'chinesa', arab: 'árabe', lebanese: 'libanesa', mexican: 'mexicana', coffee_shop: 'café',
  sandwich: 'sanduíche', chicken: 'frango', ice_cream: 'sorvete', vegetarian: 'vegetariana', vegan: 'vegana', seafood: 'frutos do mar', french: 'francesa',
  portuguese: 'portuguesa', german: 'alemã', polish: 'polonesa', ukrainian: 'ucraniana', thai: 'tailandesa', indian: 'indiana', korean: 'coreana',
  peruvian: 'peruana', bakery: 'padaria', cake: 'doces', dessert: 'sobremesas', fish: 'peixe', international: 'internacional', buffet: 'bufê', crepe: 'crepe',
  pastel: 'pastel', acai: 'açaí', breakfast: 'café da manhã', juice: 'sucos', beer: 'cerveja', kebab: 'kebab', tapas: 'tapas', hot_dog: 'cachorro-quente' };
const cuisines = c => (c || '').split(';').map(x => x.trim()).filter(Boolean).map(x => PT[x] || x.replace(/_/g, ' '));
const fmtScore = n => Number.isInteger(n) ? String(n) : n.toFixed(1).replace('.', ',');   // nota sua é inteira; a da comunidade tem decimal
const meta = p => esc([cuisines(p.cuisine).join(', '), p.bairro].filter(Boolean).join(' · ') || CATS[p.cat]);
const allPlaces = () => [...(places || []), ...db.custom];
// entradas antigas (antes do diário) tinham só date/note
const visits = r => r.visits || [{ date: r.date, note: r.note || '' }];
const fmtDay = d => new Date(d).toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' });
const byId = id => allPlaces().find(p => p.id === id) || db.ranked.find(r => r.id === id);

const ICON = { tag: '<path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1 1 0 0 1 0 1.4l-7.2 7.2a1 1 0 0 1-1.4 0z"/><circle cx="8" cy="8" r="1.4"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', bookmark: '<path d="M6 4h12v17l-6-4-6 4z"/>',
  undo: '<path d="M9 5L4 10l5 5M4 10h10a5 5 0 0 1 0 10h-3"/>',
  locate: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>',
  fit: '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>',
  route: '<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  phone: '<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  share: '<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/>',
  pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  chat: '<path d="M4 20l1.4-4A8 8 0 1 1 9 19.4z"/><path d="M9 10.5c.4 1.6 1.9 3.1 3.5 3.5l1.2-1 1.8.8v1.4"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  heart: '<path d="M12 20s-7.5-4.6-9.2-9.3A4.7 4.7 0 0 1 12 7.2a4.7 4.7 0 0 1 9.2 3.5C19.5 15.4 12 20 12 20z"/>' };
const icon = (n, fill) => `<svg class="i${fill ? ' fill' : ''}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;


async function fetchPlaces() {
  try {
    const r = await fetch('places.json');
    if (!r.ok) throw new Error(r.status);
    places = await r.json(); loadError = '';
    setTimeout(checkPlans, 1800);   // depois da abertura
  } catch (err) { loadError = String(err); }
  render();
}

// --- telas ---
const posBadge = (i, z) => `<span class="pos cond z-${z}">${i}</span>`;
const pts = (n, cls = '') => `<span class="pts cond z-${zone(n)} ${cls}">${fmtScore(n)}</span>`;
// notas das visitas em ordem de data (só as que têm nota; as antigas, de antes deste recurso, não têm)
const notedVisits = r => visits(r).filter(v => v.nota != null).sort((a, b) => a.date - b.date);
function trend(r) {   // compara a última nota com a primeira; nada se ficou igual ou se só há uma
  const n = notedVisits(r); if (n.length < 2) return null;
  const from = n[0].nota, to = n.at(-1).nota;
  return from === to ? null : { from, to, up: to > from };
}
const loveMark = p => db.ranked.find(r => r.id === p.id)?.loved ? `<svg class="i fill love" viewBox="0 0 24 24" aria-label="Amei">${ICON.heart}</svg>` : '';
const rowBody = (p, sub) => `<span class="t"><b>${esc(p.name)}${loveMark(p)}</b><small>${sub ?? meta(p)}</small></span>`;

function results() {
  if (!places) return loadError
    ? `<div class="msg">Não deu para baixar os lugares de Curitiba. Confira a internet e tente de novo.<br><button class="btn secondary" data-act="retry">Tentar de novo</button></div>`
    : `<div class="msg">Baixando os lugares de Curitiba…</div>`;
  const q = norm(query.trim());
  if (q.length < 2) {
    const top = (key, n) => { const c = {}; for (const p of places) for (const v of key(p)) c[v] = (c[v] || 0) + 1; return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, n).map(e => e[0]); };
    const chips = xs => `<div class="chips">${xs.map(x => `<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
    if (browse) {
      const base = places.filter(p => p.cat === cat && p.lat), list = filterNear(base, browse === 'open').slice(0, 40);
      return `<div class="chips filt" style="margin-top:12px"><button class="chip" data-browse="open" aria-pressed="${browse === 'open'}">Abertos agora</button><button class="chip" data-browse="near" aria-pressed="${browse === 'near'}">Perto de mim</button><button class="chip" data-browse="off">Limpar</button></div>
        ${list.length ? `<ol class="table" style="margin-top:6px">${list.map(p => `<li class="row"><button class="row-main" data-pick="${p.id}">${rowBody(p, placeSub(p))}</button></li>`).join('')}</ol>` : '<p class="msg">Nada por aqui.</p>'}`;
    }
    return `<h2 class="group">Explorar</h2><div class="chips"><button class="chip" data-browse="open">Abertos agora</button><button class="chip" data-browse="near">Perto de mim</button></div>
      <h2 class="group">Culinárias</h2>${chips(top(p => cuisines(p.cuisine).slice(0, 1), 12))}
      <h2 class="group">Bairros</h2>${chips(top(p => p.bairro ? [p.bairro] : [], 10))}`;
  }
  const sc = allScores();
  const hit = allPlaces().filter(p => norm(`${p.name} ${p.cuisine} ${cuisines(p.cuisine).join(' ')} ${p.bairro}`).includes(q))
    .sort((a, b) => norm(b.name).startsWith(q) - norm(a.name).startsWith(q)).slice(0, 50);
  if (!hit.length) return `<div class="msg">Nenhum lugar com “${esc(query.trim())}”.<br><button class="btn secondary" data-act="add">${icon('plus')}Adicionar esse lugar</button></div>`;
  return `<ol class="table" style="margin-top:14px">${hit.map(p => `<li class="row">
    <button class="row-main" data-pick="${p.id}">${rowBody(p)}</button>
    ${sc[p.id] != null ? pts(sc[p.id]) : `<button class="iconbtn" data-want="${p.id}" aria-pressed="${db.want.includes(p.id)}" aria-label="Quero ir: ${esc(p.name)}">${icon('bookmark', db.want.includes(p.id))}</button>`}</li>`).join('')}</ol>`;
}

// calendário do mês no Diário: dias com visita ficam marcados com a cor da melhor nota do dia
let calMonth = null, calDay = null;
function calendarHTML(items, sc) {
  const now = new Date(), m = calMonth || new Date(now.getFullYear(), now.getMonth(), 1);
  const byDay = {};
  for (const r of items) { const k = dayValue(r.date), n = r.visit.nota ?? sc[r.id]; (byDay[k] ||= { count: 0, best: 0 }); byDay[k].count++; byDay[k].best = Math.max(byDay[k].best, n || 0); }
  const first = new Date(m.getFullYear(), m.getMonth(), 1), days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const today = dayValue(now), cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push('<span></span>');
  for (let d = 1; d <= days; d++) {
    const k = dayValue(new Date(m.getFullYear(), m.getMonth(), d)), info = byDay[k];
    const cls = [k === today ? 'today' : '', k === calDay ? 'sel' : '', !info && db.plans.some(pl => dayValue(pl.date) === k) ? 'planned' : ''].join(' ');
    cells.push(info ? `<button class="cd has z-${zone(info.best)} ${cls}" data-calday="${k}" aria-label="${d}: ${info.count} visita${info.count > 1 ? 's' : ''}">${d}${info.count > 1 ? `<small>${info.count}</small>` : ''}</button>` : `<span class="cd ${cls}">${d}</span>`);
  }
  const title = m.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const atNow = m.getFullYear() === now.getFullYear() && m.getMonth() === now.getMonth();
  return `<div class="cal"><div class="calh"><button class="iconbtn" data-calnav="-1" aria-label="Mês anterior">${icon('back')}</button><b>${title[0].toUpperCase() + title.slice(1)}</b>
    <button class="iconbtn" data-calnav="1" aria-label="Próximo mês" ${atNow ? 'disabled' : ''} style="transform:scaleX(-1)">${icon('back')}</button></div>
    <div class="calw">${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(w => `<span>${w}</span>`).join('')}</div><div class="calg">${cells.join('')}</div></div>`;
}

// Quero ir: com texto na busca, mostra lugares para salvar; sem texto, a sua lista (idas marcadas primeiro)
let queroQuery = '';
function queroList() {
  const q = norm(queroQuery.trim());
  if (places && q.length >= 2) {
    const hit = allPlaces().filter(p => p.cat === cat && norm(`${p.name} ${p.cuisine} ${cuisines(p.cuisine).join(' ')} ${p.bairro}`).includes(q))
      .sort((a, b) => norm(b.name).startsWith(q) - norm(a.name).startsWith(q)).slice(0, 40);
    return hit.length ? `<ol class="table" style="margin-top:6px">${hit.map(p => `<li class="row"><button class="row-main" data-open="${p.id}">${rowBody(p)}</button>
      <button class="iconbtn" data-want="${p.id}" aria-pressed="${db.want.includes(p.id)}" aria-label="Quero ir: ${esc(p.name)}">${icon('bookmark', db.want.includes(p.id))}</button></li>`).join('')}</ol>`
      : `<p class="msg">Nenhum lugar com “${esc(queroQuery.trim())}”.</p>`;
  }
    const want = allPlaces().filter(p => db.want.includes(p.id) && p.cat === cat);
    if (!want.length) return `<div class="wrap empty" style="padding-top:8px"><h2>Nenhum lugar salvo em ${CATS[cat].toLowerCase()}</h2>
      <p>Busque acima, ou toque em "Quero ir" na busca e no mapa, para guardar aqui e não esquecer.</p></div>`;
    const list = filterNear(want, queroOpen), planOf = p => planFor(p.id);
    const sorted = [...list.filter(planOf).sort((a, b) => planOf(a).date - planOf(b).date), ...list.filter(p => !planOf(p))];
    return `<div class="chips filt"><button class="chip" data-qf="open" aria-pressed="${queroOpen}">Aberto agora</button><button class="chip" data-qf="near" aria-pressed="${!!nearOn}">Perto de mim</button></div>
      ${sorted.length ? `<div class="wrap" style="padding:6px 0 0"><ol class="table">${sorted.map(p => { const pl = planOf(p);
        return `<li class="row"><button class="row-main" data-open="${p.id}">${rowBody(p, pl ? `<span class="plan-when">${esc(planText(pl))}</span>` : placeSub(p))}</button>
        <button class="iconbtn${pl ? ' on' : ''}" data-plan="${p.id}" aria-label="${pl ? 'Editar ida marcada' : 'Marcar ida'}">${icon('cal')}</button><button class="pill" data-rank="${p.id}">Já fui</button></li>`; }).join('')}</ol></div>`
        : `<p class="msg">Nenhum lugar salvo aberto agora.</p>`}`;
}

const views = {
  tabela() {
    const mine = rankedIn(cat), sc = scores(mine);
    if (!mine.length) return `<div class="wrap empty"><ol class="ghost">${[1, 2, 3].map(i => `<li><span class="pos cond">${i}</span>${['Seu lugar favorito', 'O segundo melhor', 'E assim por diante'][i - 1]}</li>`).join('')}</ol>
      <h2>Seu ranking de ${CATS[cat].toLowerCase()} começa aqui</h2>
      <p>Escolha um lugar onde você já foi, diga como foi e compare com os outros. A nota sai sozinha.</p>
      <button class="btn primary" data-a="quick">${icon('plus')}Marcar lugares onde já fui</button></div>`;
    let prev;
    const rows = mine.map((r, i) => {
      const z = zone(sc[r.id]), line = prev && prev !== z ? '<li class="zline" role="presentation"></li>' : ''; prev = z;
      return `${line}<li><button class="row${r.id === justRanked ? ' new' : ''}" data-open="${r.id}">${posBadge(i + 1, z)}${rowBody(r)}${pts(sc[r.id])}</button></li>`;
    }).join('');
    return `<div class="wrap" style="padding:0"><div class="thead cond"><span>POS</span><span>LUGAR</span><span>NOTA</span></div><ol class="table">${rows}</ol>
      <p class="legend"><span><i class="z-win"></i>7 a 10</span><span><i class="z-mid"></i>4 a 6</span><span><i class="z-low"></i>1 a 3</span></p></div>`;
  },
  quero() {
    return `<div class="band"><div class="wrap"><label class="field">${icon('search')}<input id="qq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Buscar lugar para salvar" aria-label="Buscar lugar para salvar" value="${esc(queroQuery)}"></label></div></div>
      <div id="qres">${queroList()}</div>`;
  },
  buscar() {
    return `<div class="band"><div class="wrap"><label class="field">${icon('search')}<input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Nome, culinária ou bairro" aria-label="Buscar lugar" value="${esc(query)}"></label></div></div>
      <div class="wrap" style="padding:0" id="results">${results()}</div>`;
  },
  mapa() { return `<div id="map"></div><p class="maphint">Aproxime para ver todos os lugares</p><div id="mapcard" hidden></div>
    <div class="mapbtns"><button data-m="me" aria-label="Minha localização">${icon('locate')}</button><button data-m="fit" aria-label="Ver meus lugares">${icon('fit')}</button></div>`; },
  atividade() {
    const seg = syncUser ? `<div class="wrap" style="padding-bottom:0"><div class="seg">${[['me', 'Você'], ['friends', 'Amigos']].map(([k, t]) => `<button data-dmode="${k}" aria-pressed="${diaryMode === k}">${t}</button>`).join('')}</div></div>` : '';
    if (syncUser && diaryMode === 'friends') return seg + friendsDiary();
    return seg + views.myDiary();
  },
  myDiary() {
    const sc = allScores(), items = db.ranked.flatMap(r => visits(r).map(v => ({ ...r, date: v.date, visit: v }))).sort((a, b) => b.date - a.date);
    const upcoming = db.plans.filter(pl => pl.date > Date.now() - 6 * 36e5).sort((a, b) => a.date - b.date);
    if (!items.length && !upcoming.length) return `<div class="wrap empty"><h2>Nada por aqui ainda</h2><p>Cada lugar que você ranquear aparece nesta lista, do mais recente ao mais antigo.</p>
      <button class="btn primary" data-tab="buscar">${icon('plus')}Ranquear um lugar</button></div>`;
    const day = d => { const diff = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / 864e5);
      return diff === 0 ? 'Hoje' : diff === 1 ? 'Ontem' : new Date(d).toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' }); };
    const shown = calDay ? items.filter(r => dayValue(r.date) === calDay) : items;
    let last, out = (upcoming.length ? `<h2 class="group">Próximas</h2><ol class="table">${upcoming.map(pl => { const p = byId(pl.placeId); return p ? `<li><button class="row" data-plan="${p.id}">${rowBody(p, `<span class="plan-when">${esc(planText(pl))}</span>`)}${icon('cal')}</button></li>` : ''; }).join('')}</ol>` : '')
      + calendarHTML(items, sc) + (calDay ? `<p class="calsel">${new Date(calDay + 'T12:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' })} · <button class="link" data-calclear>Ver todas as visitas</button></p>` : '');
    for (const r of shown) {
      const d = day(r.date);
      if (d !== last) { out += `${last ? '</ol>' : ''}<h2 class="group">${d}</h2><ol class="table">`; last = d; }
      const sub = [r.visit.revisit ? 'Voltei' : 'Primeira visita', esc(withText(r.visit.with)), (r.visit.tags || []).join(', '), r.visit.note && `“${esc(r.visit.note)}”`].filter(Boolean).join(' · ');
      out += `<li><button class="row" data-open="${r.id}">${rowBody(r, sub)}${r.visit.photos?.length ? `<img class="rthumb" data-path="${esc(r.visit.photos[0])}" alt="">` : ''}${pts(r.visit.nota ?? sc[r.id])}</button></li>`;
    }
    return `<div class="wrap" style="padding:0 0 28px">${out}</ol></div>`;
  },
};

let map, mapState = null, mapSel = null, me = null;
function friendsDiary() {
  if (feed === null) { friendsFeed().then(f => { feed = f; if (tab === 'atividade') render(); }).catch(() => { feed = []; }); return '<div class="loading"><span class="spin" aria-label="Carregando"></span></div>'; }
  const unseen = mentions.some(m => !m.seen);
  if (unseen) { markMentionsSeen().catch(() => {}); setTimeout(() => { mentions.forEach(m => m.seen = true); document.querySelector('nav [data-tab="atividade"]')?.classList.remove('dot'); }, 0); }
  const mm = mentions.slice(0, 5).map(m => { const mine = db.ranked.some(r => r.id === m.place_id);
    return `<li><button class="row" data-mention="${esc(m.place_id)}">${uAvatar({ ...(m.who || {}), id: m.author })}<span class="t"><b>${esc(m.who?.first_name || 'Alguém')} marcou você</b><small>${esc(m.place_name)} · ${fmtDay(m.visit_date)}${mine ? '' : ' · toque para dar a sua nota'}</small></span>${m.seen ? '' : '<i class="newdot"></i>'}</button></li>`; }).join('');
  const day = d => new Date(d).toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' });
  const items = feed.map(f => `<li><div class="fitem"><button class="fwho" data-friend="${f.user_id}" aria-label="Ver perfil de ${esc(f.first_name || f.username)}">${uAvatar({ ...f, id: f.user_id })}</button>
    <button class="row" data-fplace="${esc(f.place.id)}" data-fdata="${esc(JSON.stringify(f.place))}"><span class="t"><b>${esc(f.first_name || '@' + f.username)} · ${esc(f.place.name)}</b><small>${[day(f.date), f.note && `“${esc(f.note)}”`].filter(Boolean).join(' · ')}</small></span>${f.photos?.length ? `<img class="rthumb" data-path="${esc(f.photos[0])}" alt="">` : ''}${f.nota != null ? pts(f.nota) : ''}</button></div></li>`).join('');
  if (!mm && !items) return `<div class="wrap empty"><h2>Siga seus amigos</h2><p>Quando alguém que você segue ranquear um lugar, aparece aqui.</p><button class="btn primary" data-a2="findfriends">${icon('search')}Encontrar amigos</button></div>`;
  return `<div class="wrap" style="padding:0 0 28px">${mm ? `<h2 class="group">Marcações</h2><ol class="table">${mm}</ol>` : ''}${items ? `<h2 class="group">Seus amigos</h2><ol class="table">${items}</ol>` : `<p class="sub" style="padding:16px">Seus amigos ainda não ranquearam nada.</p>`}</div>`;
}

function render() {
  document.querySelectorAll('nav button').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $('#seg').innerHTML = ['tabela', 'quero', 'mapa'].includes(tab) ? `<div class="seg">${Object.entries(CATS).map(([k, v]) =>
    `<button data-cat="${k}" aria-pressed="${k === cat}">${v}</button>`).join('')}</div>` : '';
  $('#count').textContent = db.ranked.length ? `${db.ranked.length} ${db.ranked.length === 1 ? 'lugar' : 'lugares'}` : 'Curitiba';
  const view = $('#view');
  view.className = 'v-' + tab; view.innerHTML = views[tab](); view.scrollTop = 0;
  hydratePhotos(view);
  if (tab === 'mapa') drawMap();
  justRanked = null;
}

const CENTER = [-49.2733, -25.4284];   // MapLibre usa [lon, lat]
function drawMap() {
  map?.remove();
  // mapa vetorial (MapLibre) com o estilo aberto do OpenFreeMap: nítido em qualquer zoom, sem chave
  map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/bright', center: mapState?.c ?? CENTER, zoom: mapState?.z ?? 14,
    attributionControl: false, dragRotate: false, pitchWithRotate: false });
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');
  if (matchMedia('(pointer:fine)').matches) map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  const mine = rankedIn(cat), sc = scores(mine), taken = new Set([...mine.map(r => r.id), ...db.want]);
  const want = allPlaces().filter(p => db.want.includes(p.id) && p.cat === cat && p.lat);
  const card = $('#mapcard'), hint = $('.maphint');
  const el = html => { const d = document.createElement('div'); d.innerHTML = html; return d.firstChild; };
  let ring, meMarker;

  // cartão do lugar: não cobre o mapa nem tira você de onde estava
  const hide = () => { card.hidden = true; ring?.remove(); mapSel = null; };
  const show = p => {
    card.style.animation = !card.hidden && mapSel === p.id ? 'none' : '';   // atualizar o mesmo lugar não repete a entrada
    mapSel = p.id; ring?.remove();
    ring = new maplibregl.Marker({ element: el('<span class="ring"></span>') }).setLngLat([p.lon, p.lat]).addTo(map);
    card.hidden = false;
    card.innerHTML = `<div class="ph"><button class="open-sheet" data-a="open" aria-label="Abrir ficha de ${esc(p.name)}">${placeHead(p)}</button>
      <button class="iconbtn" data-a="share" aria-label="Compartilhar">${icon('share')}</button><button class="iconbtn" data-m="close" aria-label="Fechar">${icon('x')}</button></div><div class="mg" data-id="${esc(p.id)}">${googleOn() ? '<span class="skel sq"></span><div><span class="skel"></span><span class="skel short"></span></div>' : ''}</div>${actionCells(p)}`;
    mapGoogle(p);
    card.onclick = e => {
      if (e.target.closest('[data-m="close"]')) return hide();
      const a = e.target.closest('[data-a]')?.dataset.a;
      if (a) placeAction(a, p, a === 'want' ? render : () => show(p));   // só "Quero ir" muda os pinos do mapa
    };
    // traz o lugar para a parte livre da tela, acima do cartão
    const pt = map.project([p.lon, p.lat]), h = map.getContainer().clientHeight;
    if (pt.y > h - 290 || pt.y < 70 || pt.x < 30 || pt.x > map.getContainer().clientWidth - 30) map.easeTo({ center: [p.lon, p.lat], offset: [0, -110] });
  };

  // lugares ainda não ranqueados: pontos com o nome ao lado, como num mapa de celular
  map.on('load', () => {
    for (const l of map.getStyle().layers) if (l.id.startsWith('poi')) map.removeLayer(l.id);
    const at = $('.maplibregl-ctrl-attrib'); at?.classList.remove('maplibregl-compact-show'); at?.removeAttribute('open');   // crédito recolhido no (i)
    map.addSource('dots', { type: 'geojson', data: { type: 'FeatureCollection', features: (places || []).filter(p => p.cat === cat && p.lat && !taken.has(p.id))
      .map(p => ({ type: 'Feature', properties: { id: p.id, name: p.name }, geometry: { type: 'Point', coordinates: [p.lon, p.lat] } })) } });
    map.addLayer({ id: 'dots', type: 'circle', source: 'dots', minzoom: 12.5, paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 12.5, 2.5, 15, 5, 17, 7], 'circle-color': '#1d1a17', 'circle-stroke-color': '#fff',
      'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 12.5, 1, 16, 2.5] } });
    map.addLayer({ id: 'dot-names', type: 'symbol', source: 'dots', minzoom: 14.6, layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'],
      'text-size': 12.5, 'text-anchor': 'top', 'text-offset': [0, .7], 'text-max-width': 8 }, paint: { 'text-color': '#1d1a17', 'text-halo-color': '#fff', 'text-halo-width': 1.6 } });
    const hit = e => map.queryRenderedFeatures([[e.point.x - 12, e.point.y - 12], [e.point.x + 12, e.point.y + 12]], { layers: ['dots', 'dot-names'] })[0];
    map.on('click', e => { const f = hit(e); f ? show(byId(f.properties.id)) : hide(); });
    map.on('mousemove', e => { map.getCanvas().style.cursor = hit(e) ? 'pointer' : ''; });
  });
  const sync = () => { hint.textContent = 'Aproxime para ver todos os lugares'; hint.hidden = map.getZoom() >= 12.5; };
  map.on('zoomend', sync);

  const pin = (p, html) => { const e = el(html); e.title = p.name; e.onclick = ev => { ev.stopPropagation(); show(p); }; new maplibregl.Marker({ element: e }).setLngLat([p.lon, p.lat]).addTo(map); };
  want.forEach(p => pin(p, `<span class="pin want">${icon('bookmark', true)}</span>`));
  [...mine].reverse().forEach(r => r.lat && pin(r, `<span class="pin cond z-${zone(sc[r.id])}">${mine.indexOf(r) + 1}</span>`));

  const own = [...mine, ...want].filter(p => p.lat);
  const fit = animate => { if (!own.length) return map.jumpTo({ center: CENTER, zoom: 14 });
    map.fitBounds(own.reduce((b, p) => b.extend([p.lon, p.lat]), new maplibregl.LngLatBounds()), { padding: { top: 70, bottom: 130, left: 50, right: 50 }, maxZoom: 15, animate }); };
  // volta para onde você estava: fechar uma ficha ou trocar de categoria não reinicia o mapa
  if (!mapState) fit(false);
  map.on('moveend', () => { mapState = { c: map.getCenter(), z: map.getZoom() }; });
  const drawMe = () => { meMarker?.remove(); if (me) meMarker = new maplibregl.Marker({ element: el('<span class="me"></span>') }).setLngLat(me).addTo(map); };
  $('.mapbtns').onclick = e => {
    const m = e.target.closest('[data-m]')?.dataset.m;
    if (m === 'fit') fit(true);
    if (m === 'me') {
      const fail = () => { hint.textContent = 'Não deu para pegar sua localização. Libere a permissão no navegador.'; hint.hidden = false; setTimeout(sync, 5000); };
      navigator.geolocation ? navigator.geolocation.getCurrentPosition(pos => { me = [pos.coords.longitude, pos.coords.latitude]; drawMe(); map.flyTo({ center: me, zoom: 16 }); }, fail, { enableHighAccuracy: true, timeout: 10000 }) : fail();
    }
  };
  drawMe(); sync();
  const sel = mapSel && byId(mapSel);
  if (sel?.lat && sel.cat === cat) show(sel); else mapSel = null;
}

// --- folhas ---
const dlg = $('#dlg');
function sheet(html, handler) {
  dlg.innerHTML = `<div class="sheet"><button class="iconbtn x" data-close aria-label="Fechar">${icon('x')}</button>${html}</div>`;
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;   // abrir outra coisa na mesma janela (ex.: um "Parecido") começa do topo
  dlg.onclick = e => { if (e.target === dlg || e.target.closest('[data-close]')) return dlg.close(); handler(e); };
  dlg.oninput = null; dlg.onchange = null;
  hydratePhotos(dlg);
}
dlg.addEventListener('close', () => { rankQueue = []; render(); });
const phead = p => `<div class="phead"><div><h2>${esc(p.name)}</h2><p class="sub">${meta(p)}</p></div></div>`;
const full = p => ({ ...p, ...allPlaces().find(x => x.id === p.id) });   // entrada ranqueada + dados atuais do OSM

// cabeçalho comum ao cartão e à ficha: nome, sua nota, culinária, status de horário
function placeHead(p) {
  const f = full(p), r = db.ranked.find(x => x.id === p.id), sc = r && scores(rankedIn(r.cat))[r.id];
  const st = hoursStatus(parseHours(f.hours));
  const tr = r && trend(r);
  const bits = [r ? `${pts(sc)}<span>sua nota</span>${r.loved ? loveMark(p) : ''}${tr ? `<span class="trend ${tr.up ? 'up' : 'down'}">${tr.up ? '↑ subiu' : '↓ caiu'} de ${tr.from} para ${tr.to}</span>` : ''}` : '', esc(cuisines(f.cuisine).join(', ') || CATS[f.cat]), esc(f.bairro)].filter(Boolean);
  return `<h2>${esc(f.name)}</h2><div class="pline">${bits.join('<span aria-hidden="true">·</span>')}</div>
    ${st ? `<div class="pline"><span class="${st.open ? 'st-open' : 'st-closed'}">${st.text.split(' · ')[0]}</span>${st.text.includes(' · ') ? `<span>· ${st.text.split(' · ')[1]}</span>` : ''}</div>` : ''}`;
}

// três ações principais em células; ligar e site ficam nas linhas de informação da ficha
function actionCells(p) {
  const f = full(p), r = db.ranked.find(x => x.id === p.id), saved = db.want.includes(p.id);
  const cell = (a, ic, label, extra = '') => `<button class="cell" data-a="${a}" ${extra}>${icon(ic, extra.includes('true'))}${label}</button>`;
  return `<div class="cells">
    <a class="cell primary" href="https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lon}" target="_blank" rel="noopener">${icon('route')}Rota</a>
    ${r ? cell('rank', 'plus', 'Voltei aqui') + cell('love', 'heart', 'Amei', `aria-pressed="${!!r.loved}"`)
        : cell('rank', 'plus', 'Já fui') + cell('want', 'bookmark', saved ? 'Salvo' : 'Quero ir', `aria-pressed="${saved}"`)}</div>`;
}

function placeAction(a, p, after) {
  const f = full(p);
  if (a === 'open') placeSheet(p);
  else if (a === 'rank') rankFlow(p);
  else if (a === 'want') { toggleWant(p.id); after(); }
  else if (a === 'love') { const r = db.ranked.find(x => x.id === p.id); r.loved = !r.loved; persist(); after(); }
  else if (a === 'share') {
    const text = `${f.name}${f.street ? ' — ' + f.street : ''}`, url = `https://www.google.com/maps/search/?api=1&query=${f.lat},${f.lon}`;
    navigator.share ? navigator.share({ title: f.name, text, url }).catch(() => {}) : navigator.clipboard?.writeText(`${text} ${url}`);
  }
}

function infoList(p) {
  const f = full(p), week = parseHours(f.hours), rows = [];
  if (f.street || f.bairro) rows.push(`<li>${icon('pin')}<a href="https://www.google.com/maps/search/?api=1&query=${f.lat},${f.lon}" target="_blank" rel="noopener">${esc([f.street, f.bairro, 'Curitiba'].filter(Boolean).join(' · '))}</a></li>`);
  if (week) rows.push(`<li>${icon('clock')}<details><summary>${esc(hoursStatus(week).text)} ▾</summary><div class="week">${hoursWeek(week).map(d => `<span class="${d.today ? 'today' : ''}">${d.day}</span><span class="${d.today ? 'today' : ''}">${d.text}</span>`).join('')}</div></details></li>`);
  else if (f.hours) rows.push(`<li>${icon('clock')}<span>${esc(f.hours)}</span></li>`);
  if (f.phone) rows.push(`<li>${icon('phone')}<a href="tel:${esc(f.phone.split(';')[0].replace(/[^\d+]/g, ''))}">${esc(f.phone.split(';')[0])}</a></li>`);
  if (f.site) rows.push(`<li>${icon('globe')}<a href="${esc(/^https?:/.test(f.site) ? f.site : 'https://' + f.site)}" target="_blank" rel="noopener">${esc(f.site.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a></li>`);
  if (f.insta) rows.push(`<li>${icon('globe')}<a href="https://instagram.com/${esc(f.insta.replace(/^.*instagram\.com\//, '').replace(/^@/, ''))}" target="_blank" rel="noopener">@${esc(f.insta.replace(/^.*instagram\.com\//, '').replace(/^@/, '').replace(/\/$/, ''))}</a></li>`);
  return rows.length ? `<div class="box"><ul class="info" style="list-style:none;margin:0;padding:0">${rows.join('')}</ul></div>` : '';
}

// ficha do lugar: sua nota em destaque, foto do Google como capa, suas visitas antes dos dados do lugar
function placeSheet(p) {
  const r = db.ranked.find(x => x.id === p.id), f = full(p);
  const own = r ? visits(r).flatMap(v => v.photos || []).length : 0;
  let hero = '', mid = '';
  if (r) {
    r.visits = visits(r);
    const mine = rankedIn(r.cat), sc = scores(mine)[r.id], pos = mine.findIndex(x => x.id === r.id) + 1, tr = trend(r);
    const vs = r.visits.map((v, i) => ({ v, i })).sort((a, b) => b.v.date - a.v.date);
    hero = `<div class="hero"><span class="big cond z-${zone(sc)}">${sc}</span><div class="hpos"><b>${pos}º de ${mine.length}</b><span>no seu ranking de ${CATS[r.cat].toLowerCase()}</span>${tr ? `<span class="trend ${tr.up ? 'up' : 'down'}">${tr.up ? '↑ subiu' : '↓ caiu'} de ${tr.from} para ${tr.to}</span>` : ''}</div>
      <button class="iconbtn hshare" data-a="story" aria-label="Compartilhar">${icon('share')}</button></div>`;
    mid = `${galleryHTML(r)}
      <div class="box"><h3>Suas visitas · ${vs.length}</h3><ol class="visits">${vs.map(({ v, i }) => `<li><button data-a="editvisit" data-vi="${i}" aria-label="Editar visita de ${fmtDay(v.date)}"><time>${fmtDay(v.date)}</time>${v.nota != null ? `<span class="vn cond z-${zone(v.nota)}">${v.nota}</span>` : ''}<span class="vt">${[withText(v.with), (v.tags || []).join(', '), esc(v.note)].filter(Boolean).join(' · ') || '<span style="color:var(--ink-2)">sem anotação</span>'}${v.photos?.length ? ` · ${v.photos.length} foto${v.photos.length > 1 ? 's' : ''}` : ''}</span>${icon('edit')}</button></li>`).join('')}</ol></div>`;
  }
  const sim = similarPlaces(p), inLists = db.lists.filter(l => l.items.includes(p.id)).length, pl = planFor(p.id);
  const vals = Object.values(allScores()), C = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 7;
  const myScore = r ? scores(rankedIn(r.cat))[r.id] : null, c = community(myScore == null ? [] : [{ user: 'eu', score: myScore, date: visits(r).at(-1).date }], C);
  const comm = c.score != null ? communityBox(r || p, myScore) : `<p class="cline"><b>Nota de Curitiba</b> aparece com ${c.count + c.need} avaliações${c.count ? ` · ${c.count} até agora` : ''}</p>`;
  sheet(`<div class="cover" data-id="${esc(p.id)}" ${own ? 'hidden' : ''}></div>
    <div class="ph2"><h2>${esc(f.name)}${loveMark(p)}</h2><p class="pmeta">${esc([cuisines(f.cuisine).join(', ') || CATS[f.cat], f.bairro].filter(Boolean).join(' · '))}</p><p class="gstat" data-id="${esc(p.id)}"></p>
      ${r ? '' : `<button class="iconbtn hshare top" data-a="share" aria-label="Compartilhar">${icon('share')}</button>`}</div>
    ${hero}${actionCells(p)}${mid}
    <div class="fat" data-id="${esc(p.id)}"></div>
    <div class="ginfo" data-id="${esc(p.id)}">${infoList(p)}</div>
    ${comm}
    <div class="duo">${r ? '' : `<button class="btn secondary" data-a="plan">${icon('cal')}${pl ? esc(planText(pl)) : 'Marcar ida'}</button>`}<button class="btn secondary" data-a="addlist">${icon('plus')}${inLists ? `Em ${inLists} lista${inLists > 1 ? 's' : ''}` : 'Lista'}</button></div>
    ${sim.length ? `<div class="box"><h3>Parecidos</h3><ol class="simil">${sim.map(x => `<li><button data-a="similar" data-id="${x.id}">${rowBody(x)}${db.ranked.some(y => y.id === x.id) ? pts(allScores()[x.id]) : ''}</button></li>`).join('')}</ol></div>` : ''}
    <div class="actions"><button class="btn quiet" data-a="report">Informar erro nos dados</button>${r ? '<button class="btn quiet danger" data-a="remove">Tirar do ranking</button>' : ''}</div>`, e => {
    const fr = e.target.closest('[data-friend]'); if (fr) return friendSheet(fr.dataset.friend);
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (b.dataset.view != null) return openViewer(visits(r).flatMap(v => v.photos || []).reverse(), +b.dataset.view);
    if (a === 'editvisit') return editVisit(p, r, +b.dataset.vi);
    if (a === 'similar') return placeSheet(byId(b.dataset.id));
    if (a === 'addlist') return listPicker(p);
    if (a === 'plan') return planSheet(p);
    if (a === 'report') return reportSheet(p);
    if (a === 'story') return shareStory(r, b);
    if (a === 'remove') { b.textContent = 'Confirmar: tirar do ranking'; b.dataset.a = 'remove2'; }
    else if (a === 'remove2') { deletePhotos(visits(r).flatMap(v => v.photos || [])).catch(() => {}); db.ranked = db.ranked.filter(x => x.id !== p.id); persist(); dlg.close(); }
    else placeAction(a, p, () => placeSheet(p));
  });
  friendsAtBox(p);
  googleBox(p);
}

// --- idas marcadas (Quero ir): quando, com quem, convite pelo WhatsApp e "Foi?" depois ---
let planCtx = null;   // ida que virou visita: passa quem e quando para a tela de nota
const planFor = id => db.plans.find(pl => pl.placeId === id);
function planText(pl) {
  const d = new Date(pl.date), today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(d).setHours(0, 0, 0, 0) - today) / 864e5);
  const dia = diff === 0 ? 'hoje' : diff === 1 ? 'amanhã' : d.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'numeric' }).replace('.', '');
  const hora = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }).replace(':00', 'h').replace(':', 'h');
  return [`${dia}, ${hora}`, withText(pl.with)].filter(Boolean).join(' · ');
}
const localDT = ms => { const d = new Date(ms - new Date(ms).getTimezoneOffset() * 6e4); return d.toISOString().slice(0, 16); };
function inviteText(p, pl) {
  const f = full(p), d = new Date(pl.date);
  return [`Bora na ${f.name}? ${d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' })}, às ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}.`,
    [f.street, f.bairro].filter(Boolean).join(' · '), pl.note,
    f.lat ? `Mapa: https://www.google.com/maps/search/?api=1&query=${f.lat},${f.lon}` : '', 'Marcado pela Lia'].filter(Boolean).join('\n');
}
function planSheet(p, justCreated) {
  if (!p) return;
  const ex = planFor(p.id), def = new Date(); def.setDate(def.getDate() + ((6 - def.getDay() + 7) % 7 || 7)); def.setHours(20, 0, 0, 0);   // padrão: próximo sábado, 20h
  const pl = ex ? { ...ex, with: [...ex.with] } : { id: 'pl' + Date.now().toString(36), placeId: p.id, date: def.getTime(), with: [], note: '' };
  sheet(`<h2>${ex ? 'Ida marcada' : 'Marcar ida'}</h2><p class="sub">${esc(full(p).name)}</p>
    ${justCreated ? '<p class="okmsg">Ida marcada! Agora é só convidar quem vai.</p>' : ''}
    <label class="lbl" for="pdate">Quando</label><input class="input" type="datetime-local" id="pdate" value="${localDT(pl.date)}" min="${localDT(Date.now())}">
    <span class="lbl">Com quem?</span><div id="who">${whoPicker(pl.with)}</div>

// resumo do Google em uma linha: aberto/fechado com o horário de hoje, preço e nota
function gSummary(d) {
  const days = d.regularOpeningHours?.weekdayDescriptions, today = (new Date().getDay() + 6) % 7;
  const closed = d.businessStatus === 'CLOSED_PERMANENTLY' ? 'Fechou de vez' : d.businessStatus === 'CLOSED_TEMPORARILY' ? 'Fechado temporariamente' : '';
  const open = d.currentOpeningHours?.openNow, todayTxt = days ? (days[today] || '').replace(/^[^:]+:\s*/, '') : '';
  return { closed, open, hasHours: !!days?.length, todayTxt, price: priceText(d), rating: d.rating ? String(d.rating).replace('.', ',') : '', count: d.userRatingCount || 0 };
}
// cartão do mapa: foto pequena e uma linha com horário, preço e nota (mesma consulta da ficha, guardada na sessão)

}

// Protótipo sem backend: a "comunidade" é só você. Com o servidor, `ratings` vem de todos os usuários de Curitiba.
function communityBox(r, myScore) {

}

    ${rankQueue.length ? `<button class="btn quiet wide" data-skip>Pular este · faltam ${rankQueue.length}</button>` : ''}`, e => {
    if (e.target.closest('[data-skip]')) return rankFlow(rankQueue.shift());
    const n = +e.target.closest('[data-nota]')?.dataset.nota; if (!n) return;
    const s = startSession(others.map(r => ({ ...r, similarity: similarity(place, r) })), n);
    s.max = Math.max(1, Math.ceil(Math.log2(s.sublist.length + 1)));
    compare(place, s, true);
  });
}

// só aparece quando a nota empata com outro lugar seu
function compare(place, s, enter) {
  if (done(s)) return finish(place, s);
  const c = current(s);
  sheet(`<h2>Empate no ${s.nota}</h2><p class="sub">Qual você prefere? · ${Math.min(s.history.length + 1, s.max)} de até ${s.max}</p><div class="duel">
    <button class="side" data-a="better"><b>${esc(place.name)}</b><small>${meta(place)}</small></button><span class="vs cond">×</span>
    <button class="side${enter ? ' in' : ''}" data-a="worse"><b>${esc(c.name)}</b><small>${meta(c)}</small></button></div>
    <div class="bar"><button class="btn quiet" data-a="undo" ${s.history.length ? '' : 'disabled'}>${icon('undo')}Desfazer</button>
    <button class="btn quiet" data-a="skip">Pular</button><button class="btn quiet" data-a="tough">Tanto faz</button></div>`, e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
    if (a === 'undo') undo(s); else if (a === 'tough') s.sublist = []; else answer(s, a);
    compare(place, s, a !== 'undo');
  });
}

// --- fotos: até 5 por visita, reduzidas no aparelho e guardadas na sua conta (privadas) ---
const MAX_PHOTOS = 5;
let pendingShots = 0, shotError = '';
async function hydratePhotos(root) {   // troca os caminhos guardados por links temporários do Supabase
  const imgs = [...root.querySelectorAll('img[data-path]:not([src])')];
  if (!imgs.length || !configured) return;
  try { const urls = await photoUrls([...new Set(imgs.map(i => i.dataset.path))]); imgs.forEach(i => { if (urls[i.dataset.path]) i.src = urls[i.dataset.path]; }); } catch {}
}
function shotsHTML(visit) {
  const n = visit.photos.length + pendingShots;
  return `<div class="shots">${visit.photos.map(p => `<div class="shot"><img data-path="${esc(p)}" alt=""><button class="shot-x" data-rmphoto="${esc(p)}" aria-label="Tirar foto">${icon('x')}</button></div>`).join('')}
    ${Array.from({ length: pendingShots }, () => '<div class="shot loading"><span class="spin dark"></span></div>').join('')}
    ${n < MAX_PHOTOS ? `<button class="shot add" data-addphoto>${icon('plus')}<span>Fotos</span></button>` : ''}</div>
    ${shotError ? `<p class="onb-err" role="alert">${esc(shotError)}</p>` : ''}`;
}
const redrawShots = visit => { const el = dlg.querySelector('#shots'); if (el) { el.innerHTML = shotsHTML(visit); hydratePhotos(el); } };
function shotsClick(e, visit) {
  const b = e.target.closest('[data-addphoto],[data-rmphoto]'); if (!b) return false;
  if (b.hasAttribute('data-addphoto')) { shotError = ''; dlg.querySelector('#ph-in').click(); }
  else {
    const path = b.dataset.rmphoto; b.disabled = true;
    deletePhotos([path]).then(() => { visit.photos = visit.photos.filter(x => x !== path); persist(); shotError = ''; })
      .catch(err => { shotError = errorText(err); }).finally(() => redrawShots(visit));
  }
  return true;
}
async function addPhotos(input, visit) {
  const files = [...input.files].slice(0, MAX_PHOTOS - visit.photos.length - pendingShots); input.value = '';
  if (!files.length) return;
  pendingShots += files.length; shotError = ''; redrawShots(visit);
  await Promise.all(files.map(async f => {
    try { visit.photos.push(await uploadPhoto(f)); persist(); }
    catch (err) { shotError = errorText(err); }
    finally { pendingShots--; redrawShots(visit); }
  }));
}
function galleryHTML(r) {
  const all = visits(r).flatMap(v => v.photos || []).reverse();   // mais recentes primeiro
  if (!all.length) return '';
  // no máximo 3 quadros, com arranjo próprio para 1, 2 e 3; o resto vira "+N" no último e abre na tela cheia
  const shown = all.slice(0, 3), extra = all.length - shown.length;
  return `<div class="gallery n${shown.length}">${shown.map((p, i) => `<button data-a="view" data-view="${i}" class="g" aria-label="Abrir foto ${i + 1} de ${all.length}"><img data-path="${esc(p)}" alt="">${extra && i === shown.length - 1 ? `<span class="gmore">+${extra}</span>` : ''}</button>`).join('')}</div>`;
}
// tela cheia: toque nas laterais (ou arraste) para passar, X para fechar
const viewer = $('#viewer');
function openViewer(paths, i) {
  const show = () => {
    viewer.innerHTML = `<img data-path="${esc(paths[i])}" alt="Foto ${i + 1} de ${paths.length}"><span class="vcount">${i + 1} / ${paths.length}</span>
      <button class="iconbtn vx" data-vclose aria-label="Fechar">${icon('x')}</button>
      ${i > 0 ? `<button class="vnav prev" data-vgo="-1" aria-label="Anterior"></button>` : ''}${i < paths.length - 1 ? `<button class="vnav next" data-vgo="1" aria-label="Próxima"></button>` : ''}`;
    hydratePhotos(viewer);
  };
  viewer.onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.vclose != null) viewer.close(); else { i += +b.dataset.vgo; show(); } };
  let x0 = null;
  viewer.ontouchstart = e => { x0 = e.touches[0].clientX; };
  viewer.ontouchend = e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) { const j = i + (dx < 0 ? 1 : -1); if (j >= 0 && j < paths.length) { i = j; show(); } } };
  show(); viewer.showModal();
}

function finish(place, s) {
  pendingShots = 0; shotError = '';
  const prev = db.ranked.find(r => r.id === place.id);
  db.ranked = db.ranked.filter(r => r.id !== place.id);
  const ctx = planCtx?.placeId === place.id ? planCtx : null; planCtx = null;
  const visit = { date: ctx ? Math.min(ctx.date, Date.now()) : Date.now(), note: '', revisit: !!prev, with: ctx ? [...ctx.with] : [], photos: [], tags: [] };
  if (ctx) { db.plans = db.plans.filter(x => x.id !== ctx.id); }
  const entry = { id: place.id, name: place.name, cat: place.cat, cuisine: place.cuisine, bairro: place.bairro, lat: place.lat, lon: place.lon,
    value: finalValue(s), loved: !!prev?.loved, visits: [...(prev ? visits(prev) : []), visit], date: visit.date };
  visit.nota = Math.floor(entry.value);   // cada visita guarda a nota daquele dia; a do lugar é sempre a da última
  db.ranked.push(entry); db.want = db.want.filter(id => id !== place.id); persist();
  const mine = rankedIn(place.cat), sc = scores(mine)[place.id];

    <button class="btn primary wide" data-ok>${rankQueue.length ? `Próximo lugar · faltam ${rankQueue.length}` : 'Ver no ranking'}</button>`, e => {

// começo guiado: marcar de uma vez os lugares conhecidos e ranquear um atrás do outro
function quickStart() {
  if (!places) return toast('Carregando os lugares…');
  const picked = new Map(), ranked = new Set(db.ranked.map(r => r.id));
  const pool = allPlaces().filter(p => !ranked.has(p.id));
  const CHAINS = /^(subway|mc ?donald|burger king|bob'?s|habib'?s|giraffas|starbucks|kfc|pizza hut|domino'?s|spoleto|china in box|outback|madero|jeronimo|coco bambu|cacau show|kopenhagen)/i;
  // sem dados de popularidade: quem tem site ou Instagram costuma ser mais conhecido; redes grandes ficam só na busca; a aba aberta vem primeiro
  const known = pool.filter(p => (p.insta || p.site) && !CHAINS.test(norm(p.name))).sort((a, b) => (b.cat === cat) - (a.cat === cat));
  const list = q => {
    const nq = norm(q.trim());
    const hits = nq ? pool.filter(p => norm(`${p.name} ${p.cuisine || ''} ${p.bairro || ''}`).includes(nq)) : known;
    const rows = [...picked.values(), ...hits.filter(p => !picked.has(p.id))].slice(0, 40);
    return rows.length ? rows.map(p => `<li><button class="row qs" data-pick="${p.id}" aria-pressed="${picked.has(p.id)}">
      <span class="qs-box">${icon('check')}</span>${rowBody(p, esc([CATS[p.cat], cuisines(p.cuisine).join(', '), p.bairro].filter(Boolean).join(' · ')))}</button></li>`).join('') : '<p class="sub" style="padding:12px 0">Nada com esse nome.</p>';
  };
  const btn = () => picked.size ? `Ranquear ${picked.size} ${picked.size === 1 ? 'lugar' : 'lugares'}` : 'Marque pelo menos um';
  sheet(`<h2>Onde você já foi?</h2><p class="sub">Marque os lugares de Curitiba que você conhece. Depois você dá a nota de cada um, rapidinho.</p>
    <label class="field qs-field">${icon('search')}<input id="qsq" type="search" autocomplete="off" placeholder="Buscar pelo nome, culinária ou bairro"></label>
    <ol class="table qs-list" id="qsl">${list('')}</ol>
    <div class="qs-foot"><button class="btn primary wide" data-go disabled>${btn()}</button></div>`, e => {
    const b = e.target.closest('[data-pick]');
    if (b) {
      const p = pool.find(x => x.id === b.dataset.pick);
      picked.has(p.id) ? picked.delete(p.id) : picked.set(p.id, p);
      b.setAttribute('aria-pressed', picked.has(p.id));
      const go = dlg.querySelector('[data-go]'); go.disabled = !picked.size; go.textContent = btn();
      return;
    }
    if (!e.target.closest('[data-go]') || !picked.size) return;
    rankQueue = [...picked.values()]; rankFlow(rankQueue.shift());
  });
  dlg.oninput = e => { if (e.target.id === 'qsq') dlg.querySelector('#qsl').innerHTML = list(e.target.value); };
}

// --- conta: sem sessão, abre o cadastro; com sessão, mostra a inicial no topo ---
let profile = null;
// --- sincronização com a conta ---
async function pushData() {
  if (!syncUser || syncState === 'saving') return;
  syncState = 'saving'; syncStatus();
  try { syncMeta.syncedAt = await saveUserData(db); syncMeta.dirty = false; saveMeta(); syncState = 'ok'; }
  catch { syncState = 'offline'; }   // fica marcado como pendente; tenta de novo na próxima mudança, ao voltar a internet ou ao abrir
  syncStatus();
}
// Ao entrar (e ao voltar para o app): traz da conta, junta se os dois lados mudaram, e envia o que faltar.
async function pullData() {
  if (!syncUser) return;
  let remote;
  try { remote = await loadUserData(); } catch { syncState = 'offline'; return syncStatus(); }
  if (!remote) return pushData();                                   // conta vazia: primeiro envio deste aparelho
  if (remote.updated_at === syncMeta.syncedAt) return syncMeta.dirty ? pushData() : (syncState = 'ok', syncStatus());
  const merged = syncMeta.dirty;                                    // mudou aqui e lá: junta sem perder nada
  db = fixDb(merged ? mergeData(db, remote.data) : remote.data);
  save('pinhao:v1', db);
  syncMeta.syncedAt = remote.updated_at; syncMeta.dirty = merged; saveMeta();
  if (!dlg.open) render();
  merged ? pushData() : (syncState = 'ok', syncStatus());
}
async function startSync(userId) {
  if (syncMeta.userId && syncMeta.userId !== userId) {             // outra conta entrou neste aparelho
    save('pinhao:backup-' + syncMeta.userId, db);                    // guarda o que era da conta anterior, por segurança
    db = freshDb(); save('pinhao:v1', db);
    syncMeta = { userId, syncedAt: null, dirty: false };
  }
  syncMeta.userId = userId; saveMeta(); syncUser = userId;
  await pullData();
}
async function stopSync() {   // ao sair: envia o que faltar e limpa este aparelho
  clearTimeout(pushTimer); social = { followers: [], following: [], requests: [] }; mentions = []; feed = null; diaryMode = 'me';
  $('#me').classList.remove('dot'); document.querySelector('nav [data-tab="atividade"]')?.classList.remove('dot');
  if (syncMeta.dirty) await pushData();
  syncUser = null; db = freshDb(); save('pinhao:v1', db);
  syncMeta = { userId: null, syncedAt: null, dirty: false }; saveMeta(); render();
}
const SYNC_TEXT = { saving: 'Salvando na conta…', ok: 'Tudo salvo na sua conta', offline: 'Sem conexão: salvo no celular, vai para a conta quando a internet voltar' };
function syncStatus() { const el = dlg.querySelector('.syncline'); if (el) { el.textContent = SYNC_TEXT[syncState] || ''; el.dataset.s = syncState; } }
window.addEventListener('online', () => { if (syncMeta.dirty) pushData(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// A página sabe a própria versão (BUILD é carimbado pelo publicar.sh) e compara com a publicada (version.json).
// Se estiver atrás, recarrega: ao abrir, ao voltar para a tela e a cada 30 min, desde que nenhuma ficha esteja aberta.
const BUILD = '20261123015834';
const publishedVersion = () => fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => j?.v ?? null).catch(() => null);
async function checkUpdate() {
  const v = await publishedVersion();
  if (!v || BUILD === 'dev' || v <= BUILD) return;
  // trava contra repetição: se já recarregou para esta versão e continua velha, espera a próxima abertura
  try { if (sessionStorage.getItem('lia:reloaded-for') === v) return; sessionStorage.setItem('lia:reloaded-for', v); } catch {}
  if (dlg.open) { dlg.addEventListener('close', () => location.reload(), { once: true }); return; }
  location.reload();
}
checkUpdate();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { checkUpdate(); plansChecked = false; setTimeout(checkPlans, 800); if (!dlg.open) pullData(); }
  else if (syncMeta.dirty) { clearTimeout(pushTimer); pushData(); }   // saindo do app: envia na hora o que estiver pendente
});
setInterval(checkUpdate, 30 * 60 * 1000);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const dismissed = () => load('lia:install-dismissed', 0) > Date.now() - 14 * 864e5;
function installBanner(html, onYes) {
  if (standalone || dismissed() || $('#install')) return;
  const b = document.createElement('div'); b.id = 'install'; b.innerHTML = html + `<button class="iconbtn" data-x aria-label="Agora não">${icon('x')}</button>`;
  b.onclick = e => { if (e.target.closest('[data-x]')) { save('lia:install-dismissed', Date.now()); b.remove(); } else if (e.target.closest('[data-yes]')) onYes(b); };
  document.body.append(b);
}
// Android/Chrome: o navegador oferece o prompt nativo
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installBanner(`<span class="t"><b>Instale a Lia</b><small>Abre como app, direto da tela inicial</small></span><button class="pill" data-yes>Instalar</button>`,
    async b => { e.prompt(); await e.userChoice; b.remove(); });
});
// iPhone/iPad: Safari não tem prompt, então explicamos o caminho
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone)
  setTimeout(() => installBanner(`<span class="t"><b>Instale a Lia no iPhone</b><small>Toque em ${'<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px;vertical-align:-3px"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>'} Compartilhar e depois em “Adicionar à Tela de Início”</small></span>`), 2500);
</script>
